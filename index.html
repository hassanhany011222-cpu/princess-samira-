<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Mi Princesa ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Pantalla de contraseña -->

<div id="loginPage">

<div class="glass">

<h1>❤️ Bienvenida Mi Princesa ❤️</h1>

<p>

Este pequeño rincón fue creado solamente para ti.

</p>

<input
type="password"
id="password"
placeholder="Ingresa la contraseña">

<button onclick="checkPassword()">

Entrar ❤️

</button>

<p id="error"></p>

</div>

</div>

<!-- Página principal -->

<div id="mainPage">

<header>

<h1>

Para la mujer más hermosa del mundo ❤️

</h1>

<p>

Cada segundo contigo vale toda una vida.

</p>

</header>

<section class="content">

<div class="photoBox">

<img src="photo.jpg" alt="Mi Amor">

</div>

<div class="letterBox">

<h2>

Mi querida princesa 💖

</h2>

<div class="letter">

<!-- PEGA AQUÍ TU CARTA -->

</div>

</div>

</section>

<section class="counterSection">

<h2>

❤️ Tiempo desde que nos conocimos ❤️

</h2>

<div id="timer"></div>

</section>

<section class="buttonSection">

<button id="loveButton">

Te amaré para siempre ❤️

</button>

</section>

<footer>

<p>

Con todo mi amor...

Hassan ❤️

</p>

</footer>

<audio
id="music"
loop>

<source src="music.mp3"
type="audio/mpeg">

</audio>

</div>

<script src="script.js"></script>

</body>
</html>
